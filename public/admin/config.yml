# Use DecapBridge classic auth (required)
backend:
  name: git-gateway
  repo: samueldesmit/samsresume
  branch: main
  identity_url: https://auth.decapbridge.com/sites/f4d17cc7-7d58-4bf5-9647-f9f50c0d1647
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://www.samueldesmit.com

# Media files configuration
media_folder: "src/assets"
public_folder: "/src/assets"

# Collections - define what content can be edited
collections:
  # Site Settings
  - name: "settings"
    label: "Site Settings"
    files:
      - name: "translations"
        label: "Translations"
        file: "src/content/translations.json"
        fields:
          - label: "Dutch"
            name: "nl"
            widget: "object"
            fields:
              - { label: "Hero Greeting", name: "heroGreeting", widget: "string" }
              - { label: "Hero Welcome", name: "heroWelcome", widget: "string" }
              - { label: "Hero Intro", name: "heroIntro", widget: "text" }
              - { label: "Skills Title", name: "skillsTitle", widget: "string" }
              - { label: "Contact Title", name: "contactTitle", widget: "string" }
              - { label: "Contact Text", name: "contactText", widget: "text" }
          - label: "English"
            name: "en"
            widget: "object"
            fields:
              - { label: "Hero Greeting", name: "heroGreeting", widget: "string" }
              - { label: "Hero Welcome", name: "heroWelcome", widget: "string" }
              - { label: "Hero Intro", name: "heroIntro", widget: "text" }
              - { label: "Skills Title", name: "skillsTitle", widget: "string" }
              - { label: "Contact Title", name: "contactTitle", widget: "string" }
              - { label: "Contact Text", name: "contactText", widget: "text" }

  # Cases/Portfolio
  - name: "cases"
    label: "Cases"
    folder: "src/content/cases"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Featured Image", name: "image", widget: "image" }
      - { label: "URL", name: "url", widget: "string", required: false }
      - { label: "Description (Dutch)", name: "description_nl", widget: "text" }
      - { label: "Description (English)", name: "description_en", widget: "text" }
      - { label: "Featured", name: "featured", widget: "boolean", default: false }
      - { label: "Order", name: "order", widget: "number", default: 0 }
